<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1677ff">
  <title>پشتیبانی | vpluspart</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html#products"><img src="images/logo.svg" alt="vpluspart"><span>vpluspart</span></a>
    <nav class="main-nav" aria-label="منوی اصلی">
      <a href="index.html#products">محصولات</a>
      <a href="cart.html">سبد خرید <b id="cartCount" class="badge">0</b></a>
      <a href="account.html">حساب کاربری</a>
      <a href="support.html">پشتیبانی</a>
      <button id="logoutBtn" class="nav-btn" type="button">خروج</button>
    </nav>
    <button id="menuBtn" class="menu-btn" type="button" aria-label="باز کردن منو">☰</button>
  </header>

  <main>
    <section class="section alt">
      <div class="section-head"><div><span class="eyebrow">ارتباط</span><h2>پشتیبانی</h2></div></div>
      <div class="support-grid">
        <div class="support-card"><span class="support-icon">☎</span><h3>پشتیبانی فروش</h3><p>برای پیگیری سفارش و سوالات خرید با ما در تماس باشید.</p><a id="phoneLink" href="#">تماس تلفنی</a></div>
        <div class="support-card"><span class="support-icon">◉</span><h3>واتساپ</h3><p>ارسال سریع مشخصات قطعه و دریافت راهنمایی.</p><a id="whatsappLink" href="#" target="_blank" rel="noopener">گفتگو در واتساپ</a></div>
        <form id="supportForm" class="support-card form-card">
          <h3>ارسال پیام</h3>
          <input name="subject" placeholder="موضوع" required>
          <textarea name="message" placeholder="پیام شما..." required></textarea>
          <button class="primary-btn" type="submit">ارسال پیام</button>
        </form>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <footer>© <span id="year"></span> vpluspart — فروش لوازم یدکی خودرو</footer>
  <script src="config/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
